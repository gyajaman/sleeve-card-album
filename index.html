<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sleeve — A Card Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<button class="cog" id="cog" aria-label="Settings" aria-expanded="false" aria-controls="panel">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M19.4 14.5a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h0a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>
  </svg>
</button>

<div class="panel" id="panel" role="dialog" aria-label="Settings" hidden>
  <h2>Settings</h2>

  <section>
    <h3>Binder colour</h3>
    <div class="swatches" id="coverSwatches"></div>
    <label class="custom">Custom <input type="color" id="coverPick"></label>
  </section>

  <section>
    <h3>Background</h3>
    <div class="swatches" id="bgSwatches"></div>
    <label class="custom">Custom <input type="color" id="bgPick"></label>
  </section>

  <section>
    <h3>Inner pages</h3>
    <div class="swatches" id="pagesSwatches"></div>
    <label class="custom">Custom <input type="color" id="pagesPick"></label>
  </section>

  <section>
    <h3>Sound</h3>
    <div class="seg" id="soundSeg">
      <button data-v="off">Off</button>
      <button data-v="typewriter">Typewriter</button>
    </div>
    <label class="vol">Volume <input type="range" id="volume" min="0" max="100" step="1" aria-label="Typing volume"></label>
  </section>

  <section>
    <h3>Your album</h3>
    <div class="btn-row">
      <button class="reset" id="exportBtn" type="button">Export</button>
      <button class="reset" id="importBtn" type="button">Import</button>
    </div>
    <p class="hint">Saves your cards and settings to a file you can keep, or restores them from one.</p>
  </section>

  <button class="reset" id="reset">Reset colours</button>
</div>

<main class="stage">
  <div class="scene">
    <div class="binder" id="binder">
      <div class="board"></div>
      <div class="page page-r"></div>
      <div class="cover" id="cover">
        <div class="face back"><div class="page page-l"></div></div>
        <div class="face front" tabindex="0" aria-label="Open the album">
        <div class="spine"></div>
        <div class="stitch"></div>
        <div class="label">
          <div class="line" data-key="title">
            <span class="text"></span>
            <button class="pencil" aria-label="Edit title" tabindex="0">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
            </button>
          </div>
          <div class="line sub" data-key="sub">
            <span class="text"></span>
            <button class="pencil" aria-label="Edit subtitle" tabindex="0">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.1 2.1 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
            </button>
          </div>
        </div>
        </div>
      </div>
    </div>
    <div class="shadow"></div>
  </div>
</main>

<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="importInput" accept=".json,application/json" hidden>

<div class="cropper" id="cropper" role="dialog" aria-label="Crop card" hidden>
  <div class="crop-box">
    <h2>Crop card</h2>
    <div class="crop-frame" id="cropFrame"><canvas id="cropCanvas"></canvas></div>
    <label class="vol">Zoom <input type="range" id="cropZoom" min="0" max="100" step="1" value="0" aria-label="Zoom"></label>
    <div class="crop-actions">
      <button class="btn ghost" id="cropCancel">Cancel</button>
      <button class="btn" id="cropDone">Add card</button>
    </div>
  </div>
</div>

<div class="cropper" id="confirm" role="alertdialog" aria-labelledby="confirmTitle" aria-describedby="confirmText" hidden>
  <div class="crop-box confirm-box">
    <h2 id="confirmTitle">Delete this card?</h2>
    <p id="confirmText">Are you sure? This can't be undone, and the card will be removed from your album.</p>
    <div class="crop-actions">
      <button class="btn ghost" id="confirmNo">Cancel</button>
      <button class="btn danger" id="confirmYes">Delete</button>
    </div>
  </div>
</div>

<div class="viewer" id="viewer" role="dialog" aria-label="Card viewer" hidden>
  <div class="v-card" id="vCard">
    <div class="v-tilt" id="vTilt"><img id="vImg" alt="" draggable="false"></div>
  </div>
  <button class="v-close" id="vClose" type="button" aria-label="Put the card back">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</div>

<div class="pager">
  <button id="prevBtn" aria-label="Previous page">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <span id="pageLabel"></span>
  <button id="nextBtn" aria-label="Next page">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <button id="addBtn" class="add" aria-label="Add two pages" title="Add two pages">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<script src="js/app.js"></script>
</body>
</html>
